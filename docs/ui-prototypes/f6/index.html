<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель утилит — F6</title>
  <style>
    :root {
      --canvas-width: 960px;
      --canvas-height: 770px;
      --panel-width: 800px;
      --panel-height: 508px;
      --panel-x: 80px;
      --panel-y: 78px;
      --close-width: 40px;
      --panel: #1d2229;
      --panel-close: #13181e;
      --field: #11161c;
      --accent: #ed1b61;
      --accent-shadow: #8e103a;
      --accent-hover: #c91752;
      --text: #f7f7f7;
      --muted: #e5e5e5;
      --scale: min(1, calc(100vw / var(--canvas-width)), calc(100vh / var(--canvas-height)));
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080b0f; }
    body { overflow: hidden; }
    button { font: inherit; }

    .stage {
      position: absolute;
      top: 50%; left: 50%;
      width: var(--canvas-width); height: var(--canvas-height);
      transform: translate(-50%, -50%) scale(var(--scale));
      transform-origin: center;
      overflow: hidden;
      color: var(--text);
      font-family: Consolas, "Lucida Console", monospace;
      font-size: 17px;
      line-height: 1;
      letter-spacing: -.5px;
      text-shadow: 1px 1px 0 #555;
      background:
        radial-gradient(ellipse at 76% 26%, rgba(221, 194, 178, .45) 0 12%, transparent 31%),
        radial-gradient(ellipse at 16% 30%, rgba(110, 69, 71, .76) 0 17%, transparent 39%),
        linear-gradient(135deg, #30191f 0%, #55312f 23%, #1a191b 53%, #0b0f13 86%);
    }
    .stage::before {
      content: ""; position: absolute; inset: -18px;
      background: inherit; filter: blur(12px); transform: scale(1.04); opacity: .93;
    }
    .stage::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(9, 10, 13, .08), rgba(8, 11, 15, .66));
      pointer-events: none;
    }

    .utility-panel {
      position: absolute; z-index: 1;
      left: var(--panel-x); top: var(--panel-y);
      display: block;
      width: var(--panel-width); height: var(--panel-height);
      background: var(--panel); box-shadow: 0 1px 1px rgba(0,0,0,.18);
    }
    .content { padding: 18px 20px 20px; width: 320px; }
    .shaders { position: absolute; left: 320px; right: 0; top: 60px; bottom: 20px; border-left: 1px solid #343b46; padding: 0 20px; display: flex; flex-direction: column; }
    .shaders-heading { height: 28px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .shader-list { flex: 1; min-height: 0; overflow-y: auto; background: #171c23; padding: 4px; scrollbar-color: #59616c #171c23; scrollbar-width: thin; }
    .shader-row { display: block; width: 100%; height: 48px; padding: 0 12px; border: 0; border-left: 3px solid transparent; background: transparent; text-align: left; color: var(--text); font: inherit; text-shadow: inherit; }
    .shader-row:hover { background: rgba(237,27,97,.12); }
    .shader-row[aria-checked="true"] { border-left-color: var(--accent); background: linear-gradient(90deg, rgba(237,27,97,.32), rgba(237,27,97,.06)); }
    .shader-row:first-child { margin-bottom: 6px; border-bottom: 1px solid #343b46; }

    .panel-title { height: 42px; font-size: 20px; }
    .section { margin-bottom: 20px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .section-label { color: #b8bdc6; font-size: 15px; }
    button { color: var(--text); cursor: pointer; }
    .folder-row { display: grid; grid-template-columns: 1fr 36px; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid #2a3039; }
    .resource-name { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 6px; border: 0; background: transparent; text-align: left; text-shadow: inherit; }
    .resource-name:hover { background: rgba(237, 27, 97, .15); }
    .resource-name:hover .icon { opacity: .8; }
    .bbs-button { background: var(--accent); border: 0; box-shadow: inset 0 -3px var(--accent-shadow); height: 32px; padding: 0 10px; text-shadow: 1px 1px #555; }
    .world-button { display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; box-shadow: none; }
    .bbs-button:hover { background: var(--accent-hover); color: #e5e5e5; }
    .world-button:hover { background: transparent; }
    .world-button:hover .icon, .close:hover .icon { opacity: .8; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .folder-button { width: 32px; height: 28px; padding: 2px 4px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
    .folder-button:hover .icon { opacity: .8; }
    .reload-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
    .reload-button { height: 36px; padding: 6px; border: 0; background: transparent; display: flex; justify-content: center; align-items: center; }
    .reload-button:hover .icon { opacity: .8; }
    .time-slider { appearance: none; display: block; width: 100%; height: 16px; margin: 12px 0 0; border: 0; border-radius: 0; background: linear-gradient(to right, var(--accent) 0 var(--progress), #101419 var(--progress) 100%); cursor: pointer; }
    .time-slider::-webkit-slider-thumb { appearance: none; width: 8px; height: 24px; border: 0; border-radius: 0; background: #fff; box-shadow: 0 2px #777; }
    .time-slider::-moz-range-thumb { width: 8px; height: 24px; border: 0; border-radius: 0; background: #fff; }
    .time-slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .commands .action-button { flex: 1; white-space: normal; height: 44px; line-height: 18px; }
    .commands { display: flex; align-items: center; gap: 6px; border-top: 1px solid #343b46; padding-top: 16px; }
    .icon {
      display: block; width: 24px; height: 24px;
      background-image: url("icons.png"); background-size: 384px 384px;
      background-repeat: no-repeat; image-rendering: pixelated;
    }
    .skull { background-position: -72px -216px; }
    .folder { background-position: -72px -24px; }
    .pose { background-position: -168px 0; }
    .sound { background-position: -216px -72px; }
    .video { background-position: -240px -192px; }
    .font { background-position: -72px -96px; }
    .material { background-position: -144px -24px; }
    .globe { background-position: -216px -120px; }
    .tree { background-position: -120px -120px; }
    .close-icon { background-position: -168px -24px; }

    .action-button {
      height: 32px; border: 0; border-bottom: 4px solid var(--accent-shadow);
      background: var(--accent); color: white; cursor: pointer;
      padding: 0 7px; white-space: nowrap; text-align: center;
      text-shadow: 1px 1px 0 #555;
    }
    .action-button:hover, .action-button:focus-visible { background: var(--accent-hover); color: #e5e5e5; }
    .action-button.full { width: 100%; }
    .close { position: absolute; right: 8px; top: 10px; width: 32px; height: 32px;
      border: 0; background: transparent; padding: 4px;
      display: flex; justify-content: center; align-items: center;
    }
    .close:hover { background: transparent; }
    .status {
      position: absolute; z-index: 2; left: var(--panel-x); top: calc(var(--panel-y) + var(--panel-height) + 13px);
      width: calc(var(--panel-width) - var(--close-width)); min-height: 22px; color: #fff;
      font-size: 13px; opacity: 0; transition: opacity .15s;
    }
    .status.visible { opacity: 1; }
    .resize-handle { position: absolute; z-index: 2; left: calc(var(--panel-x) + var(--panel-width) - 14px); top: calc(var(--panel-y) + var(--panel-height) - 14px); width: 12px; height: 12px; opacity: .65; background: radial-gradient(circle at 2px 10px, white 0 2px, transparent 2.5px), radial-gradient(circle at 9px 3px, white 0 2px, transparent 2.5px); }
    .utility-panel.is-closed { display: none; }
  </style>
</head>
<body>
  <main class="stage" aria-label="Демонстрация панели утилит F6">
    <section class="utility-panel" aria-labelledby="title">
      <div class="content">
        <div class="panel-title" id="title">Панель утилит</div>

        <div class="section">
          <div class="section-heading"><span class="section-label">Открыть папку ассетов</span><button class="folder-button" data-demo="Демо: открыть папку игры" aria-label="Открыть папку игры" title="Открыть папку игры"><i class="icon folder" aria-hidden="true"></i></button></div>
          <div class="folder-row">
            <button class="resource-name" data-demo="Демо: общая папка — Модели" aria-label="Модели: открыть общую папку" title="Открыть общую папку"><i class="icon pose" aria-hidden="true"></i>Модели</button>
            <button class="bbs-button world-button" data-demo="Демо: папка текущего мира — Модели" aria-label="Модели: открыть папку мира" title="Открыть ассеты текущего мира"><i class="icon globe" aria-hidden="true"></i></button>
          </div>
          <div class="folder-row">
            <button class="resource-name" data-demo="Демо: общая папка — Аудио" aria-label="Аудио: открыть общую папку" title="Открыть общую папку"><i class="icon sound" aria-hidden="true"></i>Аудио</button>
            <button class="bbs-button world-button" data-demo="Демо: папка текущего мира — Аудио" aria-label="Аудио: открыть папку мира" title="Открыть ассеты текущего мира"><i class="icon globe" aria-hidden="true"></i></button>
          </div>
          <div class="folder-row">
            <button class="resource-name" data-demo="Демо: общая папка — Видео" aria-label="Видео: открыть общую папку" title="Открыть общую папку"><i class="icon video" aria-hidden="true"></i>Видео</button>
            <button class="bbs-button world-button" data-demo="Демо: папка текущего мира — Видео" aria-label="Видео: открыть папку мира" title="Открыть ассеты текущего мира"><i class="icon globe" aria-hidden="true"></i></button>
          </div>
          <div class="folder-row">
            <button class="resource-name" data-demo="Демо: общая папка — Шрифты" aria-label="Шрифты: открыть общую папку" title="Открыть общую папку"><i class="icon font" aria-hidden="true"></i>Шрифты</button>
            <button class="bbs-button world-button" data-demo="Демо: папка текущего мира — Шрифты" aria-label="Шрифты: открыть папку мира" title="Открыть ассеты текущего мира"><i class="icon globe" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="section">
          <span class="section-label">Перезагрузить</span>
          <div class="reload-grid">
            <button class="reload-button" data-demo="Демо: перезагрузить — Текстуры" aria-label="Перезагрузить: Текстуры" title="Перезагрузить: Текстуры"><i class="icon material" aria-hidden="true"></i></button>
            <button class="reload-button" data-demo="Демо: перезагрузить — Языки" aria-label="Перезагрузить: Языки" title="Перезагрузить: Языки"><i class="icon globe" aria-hidden="true"></i></button>
            <button class="reload-button" data-demo="Демо: перезагрузить — Модели" aria-label="Перезагрузить: Модели" title="Перезагрузить: Модели"><i class="icon pose" aria-hidden="true"></i></button>
            <button class="reload-button" data-demo="Демо: перезагрузить — Звуки" aria-label="Перезагрузить: Звуки" title="Перезагрузить: Звуки"><i class="icon sound" aria-hidden="true"></i></button>
            <button class="reload-button" data-demo="Демо: перезагрузить — Мир" aria-label="Перезагрузить: Мир" title="Перезагрузить: Мир"><i class="icon tree" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="section">
          <label class="section-label" for="time-slider">Время суток</label>
          <input class="time-slider" id="time-slider" type="range" min="0" max="24000" step="10" value="6000" style="--progress: 25%">
        </div>
        <div class="commands"><button class="action-button full" data-demo="Демо: команды не выполняются">Подготовить мир</button><button class="folder-button" style="flex-shrink: 0" data-demo="Демо: /kill @e[type=!player]" aria-label="Убить всех сущностей, кроме игроков" title="Убить всех сущностей, кроме игроков: /kill @e[type=!player]"><i class="icon skull" aria-hidden="true"></i></button></div>

      </div>
      <aside class="shaders" aria-labelledby="shaders-title">
        <div class="shaders-heading"><span class="section-label" id="shaders-title">Шейдеры</span><button class="folder-button" data-demo="Демо: открыть папку шейдеров" aria-label="Открыть папку шейдеров" title="Открыть папку шейдеров"><i class="icon folder" aria-hidden="true"></i></button></div>
        <!-- Example shader names for the prototype; not an installed-pack inventory. -->
        <div class="shader-list" role="radiogroup" aria-labelledby="shaders-title">
          <button class="shader-row" role="radio" aria-checked="true" data-shader="Отключены">Отключены</button>
          <button class="shader-row" role="radio" aria-checked="false" data-shader="Complementary Reimagined">Complementary Reimagined</button>
          <button class="shader-row" role="radio" aria-checked="false" data-shader="Complementary Unbound">Complementary Unbound</button>
          <button class="shader-row" role="radio" aria-checked="false" data-shader="BSL">BSL</button>
          <button class="shader-row" role="radio" aria-checked="false" data-shader="Photon">Photon</button>
          <button class="shader-row" role="radio" aria-checked="false" data-shader="Sildur’s Vibrant">Sildur’s Vibrant</button>
        </div>
      </aside>
      <button class="close" aria-label="Закрыть панель"><i class="icon close-icon"></i></button>
    </section>
    <div class="resize-handle" aria-hidden="true"></div>
    <output class="status" aria-live="polite"></output>
  </main>
  <script>
    const panel = document.querySelector('.utility-panel');
    const status = document.querySelector('.status');
    let timeout;
    function show(message) {
      status.textContent = message;
      status.classList.add('visible');
      clearTimeout(timeout);
      timeout = setTimeout(() => status.classList.remove('visible'), 1600);
    }
    document.querySelectorAll('[data-demo]').forEach(button => button.addEventListener('click', () => show(button.dataset.demo)));
    const timeSlider = document.querySelector('#time-slider');
    timeSlider.addEventListener('input', () => {
      const ticks = Number(timeSlider.value);
      timeSlider.style.setProperty('--progress', (ticks / 240) + '%');
    });
    const shaderRows = [...document.querySelectorAll('[data-shader]')];
    function selectShader(button) {
      shaderRows.forEach(row => {
        row.setAttribute('aria-checked', String(row === button));
        row.tabIndex = row === button ? 0 : -1;
      });
      show('Демо: шейдеры — ' + button.dataset.shader);
    }
    shaderRows.forEach((button, index) => {
      button.tabIndex = index === 0 ? 0 : -1;
      button.addEventListener('click', () => selectShader(button));
      button.addEventListener('keydown', event => {
        if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? shaderRows.length - 1 : (index + (event.key === 'ArrowDown' ? 1 : -1) + shaderRows.length) % shaderRows.length;
        selectShader(shaderRows[next]);
        shaderRows[next].focus();
      });
    });
    document.querySelector('.close').addEventListener('click', () => { panel.classList.add('is-closed'); show('Панель закрыта — обновите страницу, чтобы открыть снова.'); });
  </script>
</body>
</html>
